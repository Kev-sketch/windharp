name: Build Windharp

# Builds every supported platform artifact:
#   - macOS (Apple Silicon / arm64)
#   - macOS (Intel / x86_64)
#   - Windows (x64)  -> NSIS installer + MSI
#
# Windows cannot be cross-compiled from macOS: Tauri requires the MSVC
# toolchain plus the WebView2 SDK, so the Windows artifacts are produced here on
# a windows-latest runner. Apple Silicon can be cross-compiled from an Intel Mac
# (that is what the local aarch64-apple-darwin build does), but CI builds it
# natively for consistency.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest          # arm64 runner
            target: aarch64-apple-darwin
            artifact: windharp-macos-arm64
          - label: macOS Intel
            os: macos-13              # last Intel runner image
            target: x86_64-apple-darwin
            artifact: windharp-macos-x64
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windharp-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        # src-tauri/src/lib.rs embeds dist/index.js and dist/plugins-manifest.json
        # via include_str!, so the frontend must be built before cargo runs.
        run: pnpm build:frontend

      - name: Build app
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle
        # tauri build re-runs beforeBuildCommand (frontend) — acceptable, and it
        # is what produces the installer/msi on Windows.
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows artifacts
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
