<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Windharp: a minimal geometric wind harp on a sky gradient. Original artwork (CC0-equivalent, MIT-licensed with the app).
       Drawn on the standard macOS icon template: 824x824 artwork centered on the 1024 canvas
       (Apple's 1024-pt canvas with 100-pt margins), so the Dock renders it at parity with
       system icons instead of oversized full-bleed. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE3F7"/>
      <stop offset="0.55" stop-color="#4FB2E4"/>
      <stop offset="1" stop-color="#1D63B8"/>
    </linearGradient>
  </defs>
  <g transform="translate(100,100) scale(0.8046875)">
    <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sky)"/>
  <!-- pillar -->
  <path d="M 312,352 L 312,808" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" fill="none"/>
  <!-- neck: feather-light sweep; its head curls off into a gust of wind -->
  <path d="M 312,352 Q 600,290 745,505" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M 745,505 C 785,480 815,430 790,390 C 770,358 725,365 722,398 C 720,420 740,432 758,424" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- soundboard -->
  <path d="M 312,808 L 745,505" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" fill="none"/>
  <!-- two bold strings, feet on the soundboard -->
  <path d="M 410,344 L 410,739" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" fill="none"/>
  <path d="M 590,374 L 590,613" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>
</svg>
